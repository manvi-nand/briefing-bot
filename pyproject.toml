[project]
name = "briefing-bot"
version = "0.1.0"
description = "Personal AI helper on WhatsApp/Telegram: daily audio briefing + assistant"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "apscheduler>=3.10,<4",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "fastembed>=0.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "google-genai>=2.25.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
